name: Regenerate RSS feed + site data

on:
  push:
    branches: [main]
    paths:
      - content.json             # only runs when episode/article data changes
      - scripts/build_data.py    # ...or when the derived site data format changes
  workflow_dispatch:     # allow manual trigger from Actions tab

permissions:
  contents: write        # needed to push the regenerated RSS commit

# A batch publish pushes content.json several times in quick succession, which
# started one run per push. They then raced each other pushing the regenerated
# feed and all but one failed with "failed to push some refs" (noisy red emails,
# even though the final feed was correct). Serialise instead: keep only the
# newest queued run, since regenerating from the latest content.json subsumes
# any earlier one. Do NOT cancel a run already in progress — it may be mid-push.
concurrency:
  group: regen-rss
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Regenerate podcast-feed.xml
        run: python3 scripts/generate_rss.py

      # The public pages read data/ (a small index + one file per article,
      # episode, list page, category and static page) instead of the whole
      # content.json. It is built here and committed together with the feed, so
      # a publish is still followed by a single bot push (and Pages deploy).
      # A failure must never hold back the feed: the feed is committed anyway
      # and the last step marks the run failed.
      - name: Rebuild site data (data/)
        id: data
        continue-on-error: true
        run: python3 scripts/build_data.py

      - name: Commit updated RSS + site data (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add podcast-feed.xml
          if [ "${{ steps.data.outcome }}" = "success" ]; then git add -A data; fi
          if git diff --cached --quiet; then
            echo "RSS and site data unchanged — nothing to commit."
          else
            git commit -m "auto: Regenerate RSS feed + site data from content.json"
            git push
          fi

      - name: Fail if the site data could not be rebuilt
        if: steps.data.outcome == 'failure'
        run: |
          echo "::error::scripts/build_data.py failed, so the public pages still show the previous data/ (the RSS feed was updated)."
          exit 1
