name: Regenerate RSS feed

on:
  push:
    branches: [main]
    paths:
      - content.json   # only runs when episode/article data changes
  workflow_dispatch:     # allow manual trigger from Actions tab

permissions:
  contents: write        # needed to push the regenerated RSS commit

# A batch publish pushes content.json several times in quick succession, which
# started one run per push. They then raced each other pushing the regenerated
# feed and all but one failed with "failed to push some refs" (noisy red emails,
# even though the final feed was correct). Serialise instead: keep only the
# newest queued run, since regenerating from the latest content.json subsumes
# any earlier one. Do NOT cancel a run already in progress — it may be mid-push.
concurrency:
  group: regen-rss
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Regenerate podcast-feed.xml
        run: python3 scripts/generate_rss.py

      - name: Commit updated RSS (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add podcast-feed.xml
          if git diff --cached --quiet; then
            echo "RSS unchanged — nothing to commit."
          else
            git commit -m "auto: Regenerate RSS feed from content.json"
            git push
          fi
